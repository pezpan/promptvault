spring:
  datasource:
    url: jdbc:h2:mem:promptvaultdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      continue-on-error: false

logging:
  level:
    com.promptvault: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Groq API Key (usar variable de entorno GROQ_API_KEY)
groq:
  api:
    key: ${GROQ_API_KEY:aqui_api_key}
