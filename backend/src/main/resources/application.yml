spring:
  application:
    name: promptvault
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Jackson configuration to include all properties
spring.jackson:
  default-property-inclusion: always

# Groq API Key (usar variable de entorno GROQ_API_KEY)
# Obtén tu API key gratis en: https://console.groq.com/keys
groq:
  api:
    key: ${GROQ_API_KEY:}
